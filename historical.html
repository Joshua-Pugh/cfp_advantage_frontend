<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Historical Matchup | CFP Advantage</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body data-page="historical">
    <main class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">CFP ADVANTAGE</p>
          <h1>Historical Matchup</h1>
        </div>
        <nav class="page-nav" aria-label="Site pages">
          <a href="index.html">Home</a>
          <a href="matchups.html">Matchups</a>
          <a class="is-active" href="historical.html">Build Historical Matchup</a>
          <a href="metrics.html">Metrics Guide</a>
          <a href="team.html">Team Page</a>
          <a href="bracket-room.html">Bracket Room</a>
          <a href="news.html">News</a>
          <a href="legal.html">Legal</a>
        </nav>
      </header>
      <p id="pageStatus" class="page-status">Loading...</p>
      <section class="workspace-view static-page">
        <div class="panel-heading">
          <div>
            <p class="eyebrow">As The Model Saw It</p>
            <h2>Pregame Matchup Builder</h2>
          </div>
        </div>
        <div class="matchup-controls page-controls historical-controls">
          <label><span>Season</span><select id="seasonSelect"></select></label>
          <label><span>Team</span><select id="teamASelect"></select></label>
          <label class="wide-control"><span>Actual Game</span><select id="historicalGameSelect"></select></label>
          <button id="buildHistoricalButton" type="button">Build Historical Matchup</button>
        </div>
        <div id="historicalResult" class="page-result">
          <div class="empty-state">Choose a season, team, and actual game from that team's schedule.</div>
        </div>
      </section>
    </main>
    <section id="recapModal" class="bracket-modal is-hidden" aria-label="Game recap" role="dialog" aria-modal="true">
      <div class="bracket-modal-card recap-modal-card">
        <button id="recapModalClose" class="help-close" type="button" aria-label="Close game recap">x</button>
        <div id="recapModalContent"></div>
      </div>
    </section>
    <script src="config.js"></script>
    <script src="site.js"></script>
  </body>
</html>
