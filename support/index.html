<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, follow">
    <title>Support CFP Advantage</title>
    <link rel="icon" type="image/png" href="../assets/adv-logo.png?v=4.0.78">
    <style>
      :root {
        color-scheme: light;
        --green: #174f3c;
        --green-dark: #10251d;
        --gold: #c49a39;
        --paper: #f3f6f3;
        --ink: #13221c;
        --muted: #617169;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: var(--paper);
        color: var(--ink);
        font: 16px/1.5 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      main {
        width: min(520px, 100%);
        padding: 36px;
        text-align: center;
        background: white;
        border: 1px solid #cad4ce;
        border-top: 5px solid var(--gold);
        border-radius: 12px;
        box-shadow: 0 18px 45px rgb(16 37 29 / 12%);
      }

      img {
        width: 72px;
        height: 72px;
        object-fit: contain;
      }

      h1 {
        margin: 14px 0 8px;
        color: var(--green-dark);
        font-size: clamp(1.7rem, 5vw, 2.25rem);
      }

      p {
        margin: 0 0 24px;
        color: var(--muted);
      }

      a {
        display: inline-block;
        padding: 12px 20px;
        border-radius: 7px;
        background: var(--green);
        color: white;
        font-weight: 750;
        text-decoration: none;
      }

      small {
        display: block;
        margin-top: 18px;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <main>
      <img src="../assets/adv-logo.png?v=4.0.78" alt="CFP Advantage">
      <h1>Support CFP Advantage</h1>
      <p id="supportStatus">Taking you to the secure Stripe support page...</p>
      <a id="supportLink" href="../index.html">Continue to secure support</a>
      <small>Payments are processed securely by Stripe.</small>
    </main>

    <script src="../config.js?v=4.0.84"></script>
    <script>
      (() => {
        const link = document.getElementById("supportLink");
        const status = document.getElementById("supportStatus");
        try {
          const destination = new URL(window.CFP_ADV_CONFIG?.DONATE_URL || "");
          if (destination.protocol !== "https:" || destination.hostname !== "buy.stripe.com") {
            throw new Error("Unsupported support destination");
          }
          link.href = destination.href;
          window.location.replace(destination.href);
        } catch (error) {
          status.textContent = "Secure support is temporarily unavailable. Please return to CFP Advantage and try again.";
          link.textContent = "Return to CFP Advantage";
          link.href = "../index.html";
        }
      })();
    </script>
  </body>
</html>
