<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Team Page | CFP Advantage</title>
    <link rel="stylesheet" href="styles.css?v=4.0.31">
  </head>
  <body data-page="team">
    <main class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">CFP ADVANTAGE</p>
          <h1>Team Page</h1>
        </div>
        <nav class="page-nav" aria-label="Site pages">
          <a href="index.html">Home</a>
          <a class="is-active" href="team.html">Teams</a>
          <a href="matchups.html">Matchups</a>
          <a href="bracket-room.html">Bracket Room</a>
        </nav>
      </header>
      <p id="pageStatus" class="page-status">Loading...</p>
      <section class="workspace-view static-page">
        <div class="panel-heading">
          <div>
            <p class="eyebrow">Team Intelligence</p>
            <h2>Season Profile</h2>
          </div>
        </div>
        <div class="matchup-controls page-controls">
          <label><span>Season</span><select id="teamSeasonSelect"></select></label>
          <label><span>Team</span><select id="teamPageSelect"></select></label>
          <button id="loadTeamButton" type="button">Load Team</button>
        </div>
        <nav class="workspace-tabs" aria-label="Team views">
          <button id="teamScheduleTab" class="workspace-tab is-active" type="button">Schedule & Record</button>
          <button id="teamStatsTab" class="workspace-tab" type="button">Season Stats</button>
          <button id="teamAdvProfileTab" class="workspace-tab" type="button">Contextual Football Profile</button>
        </nav>
        <div id="teamPageResult" class="page-result">
          <div class="empty-state">Choose a season and team.</div>
        </div>
      </section>
    </main>
    <section id="recapModal" class="bracket-modal is-hidden" aria-label="Game recap" role="dialog" aria-modal="true">
      <div class="bracket-modal-card recap-modal-card">
        <button id="recapModalClose" class="help-close" type="button" aria-label="Close game recap">x</button>
        <div id="recapModalContent"></div>
      </div>
    </section>
    <script src="config.js?v=4.0.31"></script>
    <script src="site.js?v=4.0.31"></script>
  </body>
</html>
